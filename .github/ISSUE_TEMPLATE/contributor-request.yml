name: Add contributor

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'contributor-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and add handle
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/add-contributor.mjs

      - name: Commit change
        if: steps.add.outputs.status == 'added'
        env:
          HANDLE: ${{ steps.add.outputs.handle }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributors.json
          git commit -m "Add contributor ${HANDLE} (#${ISSUE_NUMBER})"
          git push

      - name: Reply and close issue
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.add.outputs.status }}
          HANDLE: ${{ steps.add.outputs.handle }}
        with:
          script: |
            const handle = process.env.HANDLE;
            const messages = {
              added: `Added @${handle}. Your uploads will appear in the archive after the site rebuilds (about a minute).`,
              exists: `@${handle} is already listed.`,
              invalid: `That doesn't look like a valid handle. Use the form alice.bsky.social.`,
              unresolvable: `Couldn't find @${handle} on Bluesky. Check the spelling and try again.`,
            };
            const body = messages[process.env.STATUS] || "Something went wrong. A maintainer will take a look.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
